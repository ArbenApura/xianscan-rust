plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

ext {
    extName = 'XianScan'
    pkgNameSuffix = 'all.xianscan'
    extClass = 'eu.kanade.tachiyomi.extension.all.xianscan.XianScanFactory'
    extVersionCode = 3
    libVersion = '1.6'
}

android {
    namespace 'eu.kanade.tachiyomi.extension.all.xianscan'
    compileSdk 34

    defaultConfig {
        applicationId 'eu.kanade.tachiyomi.extension.all.xianscan'
        minSdk 23
        targetSdk 34
        versionCode extVersionCode
        versionName "$libVersion.$extVersionCode"
        manifestPlaceholders = [
            appName: 'XianScan',
            extClass: extClass,
            nsfw: 0,
            extensionLib: libVersion,
        ]
        setProperty('archivesBaseName', "tachiyomi-$pkgNameSuffix-v$versionName")
    }

    signingConfigs {
        release {
            def propFile = rootProject.file("signing.properties")
            def props = new Properties()
            if (propFile.exists()) {
                propFile.withInputStream { props.load(it) }
            }
            def keystorePath = System.getenv("SIGNING_KEYSTORE_PATH") ?: props.getProperty("storeFile") ?: project.findProperty("signingKeystorePath")
            if (keystorePath) {
                def kFile = file(keystorePath).isAbsolute() ? file(keystorePath) : rootProject.file(keystorePath)
                if (kFile.exists()) {
                    storeFile kFile
                    storePassword System.getenv("SIGNING_KEYSTORE_PASSWORD") ?: props.getProperty("storePassword") ?: project.findProperty("signingKeystorePassword")
                    keyAlias System.getenv("SIGNING_KEY_ALIAS") ?: props.getProperty("keyAlias") ?: project.findProperty("signingKeyAlias")
                    keyPassword System.getenv("SIGNING_KEY_PASSWORD") ?: props.getProperty("keyPassword") ?: project.findProperty("signingKeyPassword")
                }
            }
        }
    }

    buildTypes {
        release {
            // NO GIT METADATA IN THE APK (FEAT-005 PHASE 3)
            vcsInfo.include = false
            minifyEnabled false
            def hasSigning = signingConfigs.release.storeFile != null
            signingConfig hasSigning ? signingConfigs.release : signingConfigs.debug
        }
    }

    // NO BUILD METADATA IN THE APK: THE KOTLIN TOOLING FILE AND THE ENCRYPTED DEPENDENCY BLOCK (FEAT-005 PHASE 3)
    packaging {
        resources {
            excludes += ['kotlin-tooling-metadata.json']
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    buildFeatures {
        aidl false
        renderScript false
        resValues false
        shaders false
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
        freeCompilerArgs += '-opt-in=kotlinx.serialization.ExperimentalSerializationApi'
    }
}

dependencies {
    // EVERYTHING HERE IS PROVIDED BY THE HOST AT RUNTIME. NOTHING MAY BE `implementation` (FEAT-005 PHASE 2).
    // THE KOTLIN STDLIB IS compileOnly TOO, SO IT IS NEVER PACKAGED (SEE kotlin.stdlib.default.dependency).
    compileOnly libs.kotlin.stdlib
    // EXTENSION API STUBS AND DI USED TO RESOLVE THE APP CONTEXT INSIDE THE EXTENSION PROCESS.
    compileOnly libs.tachiyomi.lib
    compileOnly libs.injekt.core
    compileOnly libs.preference.ktx
    compileOnly libs.okhttp
    compileOnly libs.rxjava
    compileOnly libs.coroutines.android
    compileOnly libs.serialization.json

    // UNIT TESTS ONLY (FEAT-005 PHASE 9); testImplementation NEVER REACHES THE APK (scripts/verify-apk.sh PROVES IT).
    testImplementation libs.junit
    testImplementation libs.kotlin.stdlib
    testImplementation libs.serialization.json
    // EXTENSION API STUBS, SO SManga RESOLVES WHEN THE DTO FILE CLASS IS LOADED
    testImplementation libs.tachiyomi.lib
}
