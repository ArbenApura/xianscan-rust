# DEPENDENCY VERSIONS FOR THE XIANSCAN MIHON / TACHIMANGA EXTENSION (FEAT-005 PHASE 2).
# EVERYTHING UNDER [libraries] IS compileOnly: THE HOST APP PROVIDES IT AT RUNTIME.
[versions]
kotlin = "2.4.10"            # MUST EQUAL KEIYOUSHI kotlin-gradle (RE-CHECKED 2026-09-26)
agp = "8.5.2"                # UNCHANGED IN THIS FEATURE (SEE ADR-002)

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }
tachiyomi-lib = { module = "com.github.keiyoushi:extensions-lib", version = "6e0c96cea8" }
injekt-core = { module = "com.github.null2264.injekt:injekt-core", version = "4135455a2a" }
preference-ktx = { module = "androidx.preference:preference-ktx", version = "1.2.1" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version = "5.0.0-alpha.14" }
rxjava = { module = "io.reactivex:rxjava", version = "1.3.8" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version = "1.9.0" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.7.3" }
junit = { module = "junit:junit", version = "4.13.2" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
