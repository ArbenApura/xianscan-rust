<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/logo.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#b23a2e" />
		<meta name="description" content="XianScan Documentation - Native Comic Translation Server for Chinese Manhua, Korean Manhwa, and Japanese Manga." />
		<script>
			// PREVENT FLASH OF UNSTYLED THEME / SCROLLBAR ON INITIAL PAGE LOAD
			try {
				var savedTheme = localStorage.getItem('xianscan:docs:theme') || 'auto';
				var isDark = savedTheme === 'dark' || (savedTheme === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
				if (isDark) {
					document.documentElement.classList.add('dark');
					document.documentElement.style.colorScheme = 'dark';
					document.documentElement.style.backgroundColor = '#13100c';
				} else if (savedTheme === 'sepia') {
					document.documentElement.classList.remove('dark');
					document.documentElement.style.colorScheme = 'light';
					document.documentElement.style.backgroundColor = '#f4ecd8';
				} else {
					document.documentElement.classList.remove('dark');
					document.documentElement.style.colorScheme = 'light';
					document.documentElement.style.backgroundColor = '#fbfaf7';
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
