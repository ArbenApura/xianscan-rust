<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- FAVICONS & ICONS FOR BROWSERS & SEARCH ENGINES -->
		<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
		<link rel="alternate icon" href="/favicon.ico?v=3" />
		<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=3" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=3" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=3" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#b23a2e" />
		<meta name="application-name" content="XianScan" />
		<meta name="author" content="Arben Apura" />
		<script>
			// PREVENT FLASH OF UNSTYLED THEME / SCROLLBAR ON INITIAL PAGE LOAD
			try {
				var savedTheme = localStorage.getItem('xianscan:docs:theme') || 'auto';
				var isDark = savedTheme === 'dark' || (savedTheme === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
				if (isDark) {
					document.documentElement.classList.add('dark');
					document.documentElement.style.colorScheme = 'dark';
					document.documentElement.style.backgroundColor = '#13100c';
				} else if (savedTheme === 'sepia') {
					document.documentElement.classList.remove('dark');
					document.documentElement.style.colorScheme = 'light';
					document.documentElement.style.backgroundColor = '#f4ecd8';
				} else {
					document.documentElement.classList.remove('dark');
					document.documentElement.style.colorScheme = 'light';
					document.documentElement.style.backgroundColor = '#fbfaf7';
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
