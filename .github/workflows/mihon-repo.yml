name: Mihon Extension Repository

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'extensions/xianscan-mihon/**'
      - '.github/workflows/mihon-repo.yml'
  workflow_dispatch:

# FEAT-008 PHASE 4: NO WORKFLOW-LEVEL TOKEN SCOPES. THE SIGNING SECRETS LIVE ONLY IN build, THE WRITE TOKEN
# LIVES ONLY IN deploy.
permissions: {}

jobs:
  build:
    name: Build Mihon Repo
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK (no emulator)
        # android-actions/setup-android@v3 installs the Android Emulator by default, which this
        # APK-only build never needs and which periodically fails with "Error on ZipFile unknown
        # archive" on a corrupt emulator download. Install only the SDK components required to
        # compile (:app:assembleRelease) and pin sdk.dir to the runner's preinstalled SDK.
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=""
          for CAND in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"; do
            if [ -x "$CAND" ]; then SDKMANAGER="$CAND"; break; fi
          done
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          else
            echo "::warning::sdkmanager not found; relying on preinstalled Android SDK"
          fi
          echo "sdk.dir=$ANDROID_HOME" > extensions/xianscan-mihon/local.properties
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Setup Signing Keystore
        working-directory: extensions/xianscan-mihon
        env:
          KEYSTORE_BASE64: ${{ secrets.MIHON_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MIHON_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MIHON_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MIHON_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > xianscan-release.jks
            echo "storeFile=xianscan-release.jks" > signing.properties
            echo "storePassword=${KEYSTORE_PASSWORD:-xianscan123}" >> signing.properties
            echo "keyAlias=${KEY_ALIAS:-xianscan}" >> signing.properties
            echo "keyPassword=${KEY_PASSWORD:-xianscan123}" >> signing.properties
            echo "Release keystore configured from GitHub Secrets."
          else
            echo "Generating ephemeral CI release keystore..."
            keytool -genkeypair -v -keystore xianscan-release.jks -alias xianscan -keyalg RSA -keysize 2048 -validity 10000 -storepass xianscan123 -keypass xianscan123 -dname "CN=XianScan, OU=Mihon, O=XianScan, L=Global, ST=Global, C=US"
            echo "storeFile=xianscan-release.jks" > signing.properties
            echo "storePassword=xianscan123" >> signing.properties
            echo "keyAlias=xianscan" >> signing.properties
            echo "keyPassword=xianscan123" >> signing.properties
          fi

      - name: Build Signed Release APK
        working-directory: extensions/xianscan-mihon
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease

      - name: Verify APK contents
        # THE APK MAY HOLD ONLY XIANSCAN'S OWN CLASSES; THE HOST PROVIDES KOTLIN AND EVERY LIBRARY (FEAT-005 PHASE 8)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          bash extensions/xianscan-mihon/scripts/verify-apk.sh

      - name: Assemble Mihon Extension Repository Assets
        run: |
          mkdir -p repo-dist/apk

          # APK, index.json, index.min.json AND index.pb ARE ALL DERIVED FROM THE BUILD'S output-metadata.json, SO THE
          # INDEX ALWAYS DESCRIBES THE APK THAT WAS BUILT (FEAT-005 PHASE 10, ADR-006)
          python3 extensions/xianscan-mihon/scripts/build-repo-index.py repo-dist

          # GENERATE REPO DEFINITION JSON (MATCHING KEIYOUSHI STRUCTURE)
          cat << 'EOF' > repo-dist/repo.json
          {
            "index_v2": "https://github.com/ArbenApura/xianscan-rust/raw/repo/index.pb",
            "meta": {
              "name": "XianScan",
              "website": "https://github.com/ArbenApura/xianscan-rust",
              "signingKeyFingerprint": "2d2bfe33f124f582d6f2f60ed4192b79cb51afc3a17f6dd92d7df87e6886dfa6"
            }
          }
          EOF
          python3 -c "import json; data=json.load(open('repo-dist/repo.json')); json.dump(data, open('repo-dist/repo.min.json', 'w'), separators=(',', ':'))"

          # COPY README FOR THE EXTENSION
          cp extensions/xianscan-mihon/README.md repo-dist/README.md

      - name: Upload Repository as Workflow Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repo-dist
          path: repo-dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy Mihon Repo
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Repository Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: repo-dist
          path: repo-dist

      - name: Deploy to 'repo' Branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: repo
          publish_dir: ./repo-dist
          keep_files: false
          force_orphan: true
