name: Mihon Extension Repository

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'extensions/xianscan-mihon/**'
      - '.github/workflows/mihon-repo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy-repo:
    name: Build & Deploy Mihon Repo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Signing Keystore
        working-directory: extensions/xianscan-mihon
        env:
          KEYSTORE_BASE64: ${{ secrets.MIHON_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MIHON_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MIHON_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MIHON_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > xianscan-release.jks
            echo "storeFile=xianscan-release.jks" > signing.properties
            echo "storePassword=${KEYSTORE_PASSWORD:-xianscan123}" >> signing.properties
            echo "keyAlias=${KEY_ALIAS:-xianscan}" >> signing.properties
            echo "keyPassword=${KEY_PASSWORD:-xianscan123}" >> signing.properties
            echo "Release keystore configured from GitHub Secrets."
          else
            echo "Generating ephemeral CI release keystore..."
            keytool -genkeypair -v -keystore xianscan-release.jks -alias xianscan -keyalg RSA -keysize 2048 -validity 10000 -storepass xianscan123 -keypass xianscan123 -dname "CN=XianScan, OU=Mihon, O=XianScan, L=Global, ST=Global, C=US"
            echo "storeFile=xianscan-release.jks" > signing.properties
            echo "storePassword=xianscan123" >> signing.properties
            echo "keyAlias=xianscan" >> signing.properties
            echo "keyPassword=xianscan123" >> signing.properties
          fi

      - name: Build Signed Release APK
        working-directory: extensions/xianscan-mihon
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease

      - name: Assemble Mihon Extension Repository Assets
        run: |
          mkdir -p repo-dist/apk
          
          # COPY BUILT APK TO BOTH ROOT AND APK/ FOR 100% RESOLUTION COMPATIBILITY
          APK_SRC=$(find extensions/xianscan-mihon/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          APK_NAME="tachiyomi-all.xianscan-v1.6.2.apk"
          cp "$APK_SRC" "repo-dist/$APK_NAME"
          cp "$APK_SRC" "repo-dist/apk/$APK_NAME"
          # BACKWARD COMPATIBILITY ALIAS
          cp "$APK_SRC" "repo-dist/tachiyomi-all.xianscan-v1.6.1.apk"
          cp "$APK_SRC" "repo-dist/apk/tachiyomi-all.xianscan-v1.6.1.apk"
          
          # GENERATE REPO INDEX JSON
          cat << 'EOF' > repo-dist/index.json
          [
            {
              "name": "XianScan",
              "pkg": "eu.kanade.tachiyomi.extension.all.xianscan",
              "apk": "tachiyomi-all.xianscan-v1.6.2.apk",
              "lang": "all",
              "code": 2,
              "version": "1.6.2",
              "nsfw": 0,
              "hasReadme": 1,
              "hasChangelog": 0,
              "sources": [
                {
                  "name": "XianScan",
                  "lang": "all",
                  "id": 0,
                  "baseUrl": "http://127.0.0.1:8124"
                }
              ]
            }
          ]
          EOF
          
          # GENERATE MINIFIED REPO INDEX JSON
          python3 -c "import json; data=json.load(open('repo-dist/index.json')); json.dump(data, open('repo-dist/index.min.json', 'w'), separators=(',', ':'))"
          
          # GENERATE REPO DEFINITION JSON (MATCHING KEIYOUSHI STRUCTURE)
          cat << 'EOF' > repo-dist/repo.json
          {
            "index_v2": "https://github.com/ArbenApura/xianscan-rust/raw/repo/index.pb",
            "meta": {
              "name": "XianScan",
              "website": "https://github.com/ArbenApura/xianscan-rust",
              "signingKeyFingerprint": "2d2bfe33f124f582d6f2f60ed4192b79cb51afc3a17f6dd92d7df87e6886dfa6"
            }
          }
          EOF
          python3 -c "import json; data=json.load(open('repo-dist/repo.json')); json.dump(data, open('repo-dist/repo.min.json', 'w'), separators=(',', ':'))"

          # GENERATE GZIP PROTOBUF INDEX.PB (MATCHING MIHON NETWORKEXTENSIONSTORE MODEL)
          python3 -c "
          import gzip

          def encode_varint(val):
              out = bytearray()
              while val > 0x7f:
                  out.append((val & 0x7f) | 0x80)
                  val >>= 7
              out.append(val & 0x7f)
              return bytes(out)

          def encode_field(num, wire, data):
              return encode_varint((num << 3) | wire) + data

          def encode_varint_field(num, val):
              return encode_field(num, 0, encode_varint(val))

          def encode_bytes_field(num, data):
              if isinstance(data, str):
                  data = data.encode('utf-8')
              return encode_field(num, 2, encode_varint(len(data)) + data)

          # 1. Source (field 8 of extension)
          source_bytes = (
              encode_varint_field(1, 0) +
              encode_bytes_field(2, 'XianScan') +
              encode_bytes_field(3, 'all') +
              encode_bytes_field(4, 'http://127.0.0.1:8124')
          )

          # 2. Assets (field 3 of extension)
          assets_bytes = (
              encode_bytes_field(1, 'https://raw.githubusercontent.com/ArbenApura/xianscan-rust/repo/tachiyomi-all.xianscan-v1.6.2.apk') +
              encode_bytes_field(2, 'https://raw.githubusercontent.com/ArbenApura/xianscan-rust/main/extensions/xianscan-mihon/app/src/main/res/mipmap-xhdpi/ic_launcher.png')
          )

          # 3. Extension (field 1 inside field 101)
          ext_bytes = (
              encode_bytes_field(1, 'XianScan') +
              encode_bytes_field(2, 'eu.kanade.tachiyomi.extension.all.xianscan') +
              encode_bytes_field(3, assets_bytes) +
              encode_bytes_field(4, '1.6') +
              encode_varint_field(5, 2) +
              encode_bytes_field(6, '1.6.2') +
              encode_varint_field(7, 0) +
              encode_bytes_field(8, source_bytes)
          )

          # 4. Field 101 wrapper (repeated field 1)
          field_101_bytes = encode_bytes_field(1, ext_bytes)

          # 5. Links (field 4)
          links_bytes = encode_bytes_field(1, 'https://github.com/ArbenApura/xianscan-rust')

          # 6. Root message
          root_bytes = (
              encode_bytes_field(1, 'XianScan') +
              encode_bytes_field(2, 'XIAN') +
              encode_bytes_field(3, '2d2bfe33f124f582d6f2f60ed4192b79cb51afc3a17f6dd92d7df87e6886dfa6') +
              encode_bytes_field(4, links_bytes) +
              encode_bytes_field(101, field_101_bytes)
          )

          with open('repo-dist/index.pb', 'wb') as f:
              f.write(gzip.compress(root_bytes))
          print('Successfully generated repo-dist/index.pb with byte size:', len(root_bytes))
          "

          # COPY README FOR THE EXTENSION
          cp extensions/xianscan-mihon/README.md repo-dist/README.md

      - name: Deploy to 'repo' Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: repo
          publish_dir: ./repo-dist
          keep_files: false
          force_orphan: true
