name: Release Multi-Platform Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing release tag to build and publish'
        required: true
        default: ''

# FEAT-008 PHASE 4: NO WORKFLOW-LEVEL TOKEN SCOPES. EVERY JOB DECLARES THE LEAST IT NEEDS.
permissions: {}

# THE ONE PLACE THE TAG IS DERIVED. STEPS READ $TAG_NAME (SHELL) OR ${{ env.TAG_NAME }} (ACTION INPUTS).
env:
  TAG_NAME: ${{ github.event.inputs.tag_name || github.ref_name }}

concurrency:
  group: release-${{ github.event.inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  # FEAT-008 PHASE 2: THE TAG MUST EQUAL v + THE VERSION IN Cargo.toml, web/package.json, Cargo.lock AND THE WEB
  # FALLBACK LITERALS. NOTHING IS BUILT OR PUBLISHED OTHERWISE.
  verify-version:
    name: Verify release version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ env.TAG_NAME }}
          persist-credentials: false
      - name: Check versions
        run: bash scripts/check-release-version.sh "$TAG_NAME"

  build-release:
    name: Build ${{ matrix.target }}
    needs: verify-version
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64 (DirectML - dedicated AMD Radeon, Intel Arc and NVIDIA GPUs)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: xianscan.exe
            release_asset: xianscan-windows-x86_64.zip
            cargo_features: directml,embed-models,embed-web

          # Linux x86_64 (Ubuntu / Debian / Fedora)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: xianscan
            release_asset: xianscan-linux-x86_64.tar.gz
            cargo_features: embed-models,embed-web,cuda

          # macOS Apple Silicon (M1 / M2 / M3 / M4)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: xianscan
            release_asset: xianscan-macos-arm64.tar.gz
            cargo_features: embed-models,embed-web,coreml

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ env.TAG_NAME }}
          persist-credentials: false

      - name: Setup Node.js (for Web UI build)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # EXACT PIN (FEAT-008 PHASE 4). THIS NODE IS ALSO THE RUNTIME STAGED INTO THE BINARY BELOW.
          node-version-file: .nvmrc

      - name: Record Pinned Node.js Version
        shell: bash
        run: |
          echo "Node.js $(node --version) (pinned in .nvmrc: $(tr -d '[:space:]' < .nvmrc))" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install Linux Native Build Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -y
          # Required by better-sqlite3 (node-gyp) and @napi-rs/canvas (Skia prebuilt)
          sudo apt-get install -y build-essential python3 libfontconfig1-dev

      - name: Build SvelteKit Frontend + Native Addons
        working-directory: web
        shell: bash
        # FROZEN LOCKFILE AND NO DEPENDENCY LIFECYCLE SCRIPTS. ONLY better-sqlite3 NEEDS ITS INSTALL SCRIPT
        # (PREBUILT OR node-gyp), SO IT IS REBUILT EXPLICITLY AND ITS ADDON IS CHECKED (FEAT-008 PHASE 4).
        run: |
          yarn install --frozen-lockfile --ignore-scripts
          npm rebuild better-sqlite3
          test -f node_modules/better-sqlite3/build/Release/better_sqlite3.node
          yarn build

      - name: Download AI Model Weights for Embedded Binary
        shell: bash
        # PINNED REVISIONS AND SHA-256 FROM models/manifest.tsv; build.rs CHECKS THEM AGAIN (FEAT-008 PHASE 3)
        run: |
          bash scripts/fetch-models.sh
          ls -lh models/

      - name: Stage Standalone Node.js Runtime for Embedded Binary
        shell: bash
        run: |
          mkdir -p web/bin
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            NODE_PATH=$(which node)
            cp "$NODE_PATH" web/bin/node.exe
          else
            NODE_PATH=$(which node)
            cp "$NODE_PATH" web/bin/node
            chmod +x web/bin/node
          fi
          echo "Staged Node.js runtime version:"
          STAGED=$(web/bin/node* --version)
          echo "$STAGED"
          EXPECTED="v$(tr -d '[:space:]' < .nvmrc)"
          if [ "$STAGED" != "$EXPECTED" ]; then
            echo "::error::Staged Node.js $STAGED does not match the pinned $EXPECTED from .nvmrc"
            exit 1
          fi
          ls -lh web/bin/

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build Standalone 1-File Release Binary (Embedded Models + Web UI + Node.js)
        run: cargo build --release --no-default-features --features ${{ matrix.cargo_features }} --target ${{ matrix.target }}


      # Packaging Windows Archive
      - name: Package Windows Binary
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging -Force
          Copy-Item target/${{ matrix.target }}/release/xianscan.exe staging/xianscan.exe
          Get-ChildItem -Path target/${{ matrix.target }}/release -Filter "*.dll" | ForEach-Object {
            Copy-Item $_.FullName staging/
          }
          Copy-Item README.md staging/ -ErrorAction SilentlyContinue
          Copy-Item LICENSE staging/ -ErrorAction SilentlyContinue
          Compress-Archive -Path staging/* -DestinationPath ${{ matrix.release_asset }}

      # Packaging: resolve + ship the ORT CUDA provider libraries with the Linux binary.
      # With ort's `copy-dylibs` these land in target/ as SYMLINKS pointing into the
      # ort download cache; a bare symlink does not survive a tarball, and without the
      # provider .so files the CUDA-enabled build silently falls back to CPU at runtime.
      - name: Package Linux ORT CUDA Provider Libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p staging
          for f in libonnxruntime_providers_cuda.so \
                   libonnxruntime_providers_shared.so \
                   libonnxruntime_providers_tensorrt.so \
                   libonnxruntime_providers_nv_tensorrt_rtx.so; do
            if [ -e "target/${{ matrix.target }}/release/$f" ]; then
              cp -L "target/${{ matrix.target }}/release/$f" "staging/$f"
            fi
          done
          ls -lh staging/

      # Packaging Linux & macOS Archives
      - name: Package Unix Binary
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/xianscan staging/xianscan
          cp README.md staging/ 2>/dev/null || true
          cp LICENSE staging/ 2>/dev/null || true
          chmod +x staging/xianscan
          tar -czf ${{ matrix.release_asset }} -C staging .


      # PUBLISH-ONCE (FEAT-008 PHASE 4): BUILD JOBS ONLY HAND OVER WORKFLOW ARTIFACTS. publish-release CREATES
      # THE GITHUB RELEASE AFTER EVERY BUILD LEG SUCCEEDED, SO A FAILED LEG NEVER LEAVES A PARTIAL RELEASE.
      - name: Upload Release Archive as Workflow Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bin-${{ matrix.target }}
          path: ${{ matrix.release_asset }}
          if-no-files-found: error
          retention-days: 7

  build-extension:
    name: Build Browser Extension
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ env.TAG_NAME }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install Extension Dependencies
        working-directory: extensions/xianscan-importer
        # ONLY esbuild HAS AN INSTALL SCRIPT HERE AND THE BUILD USES ITS JS API (FEAT-008 PHASE 4)
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Run Extension Unit Tests
        working-directory: extensions/xianscan-importer
        run: yarn test

      - name: Package Extension (Chrome ZIP + Firefox XPI)
        working-directory: extensions/xianscan-importer
        run: yarn package

      - name: Upload Extension Packages as Workflow Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: importer
          path: |
            extensions/xianscan-importer/store/*.zip
            extensions/xianscan-importer/store/*.xpi
          if-no-files-found: error
          retention-days: 7

  build-mihon-extension:
    name: Build Mihon Android Extension
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ env.TAG_NAME }}
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK (no emulator)
        # android-actions/setup-android@v3 installs the Android Emulator by default, which this
        # APK-only build never needs and which periodically fails with "Error on ZipFile unknown
        # archive" on a corrupt emulator download. Install only the SDK components required to
        # compile (:app:assembleRelease) and pin sdk.dir to the runner's preinstalled SDK.
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=""
          for CAND in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"; do
            if [ -x "$CAND" ]; then SDKMANAGER="$CAND"; break; fi
          done
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          else
            echo "::warning::sdkmanager not found; relying on preinstalled Android SDK"
          fi
          echo "sdk.dir=$ANDROID_HOME" > extensions/xianscan-mihon/local.properties
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Setup Signing Keystore
        working-directory: extensions/xianscan-mihon
        env:
          KEYSTORE_BASE64: ${{ secrets.MIHON_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MIHON_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MIHON_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MIHON_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > xianscan-release.jks
            echo "storeFile=xianscan-release.jks" > signing.properties
            echo "storePassword=${KEYSTORE_PASSWORD:-xianscan123}" >> signing.properties
            echo "keyAlias=${KEY_ALIAS:-xianscan}" >> signing.properties
            echo "keyPassword=${KEY_PASSWORD:-xianscan123}" >> signing.properties
          else
            keytool -genkeypair -v -keystore xianscan-release.jks -alias xianscan -keyalg RSA -keysize 2048 -validity 10000 -storepass xianscan123 -keypass xianscan123 -dname "CN=XianScan, OU=Mihon, O=XianScan, L=Global, ST=Global, C=US"
            echo "storeFile=xianscan-release.jks" > signing.properties
            echo "storePassword=xianscan123" >> signing.properties
            echo "keyAlias=xianscan" >> signing.properties
            echo "keyPassword=xianscan123" >> signing.properties
          fi

      - name: Build Signed Release APK
        working-directory: extensions/xianscan-mihon
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease

      - name: Verify APK contents
        # THE APK MAY HOLD ONLY XIANSCAN'S OWN CLASSES; THE HOST PROVIDES KOTLIN AND EVERY LIBRARY (FEAT-005 PHASE 8)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          bash extensions/xianscan-mihon/scripts/verify-apk.sh

      - name: Upload Mihon APK as Workflow Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mihon-apk
          path: extensions/xianscan-mihon/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove Signing Material
        if: always()
        working-directory: extensions/xianscan-mihon
        run: rm -f xianscan-release.jks signing.properties

  # FEAT-008 PHASE 4: THE ONLY JOB THAT CREATES THE RELEASE. IT RUNS AFTER EVERY BUILD LEG SUCCEEDED, HAS NO
  # CHECKOUT AND NO INSTALL STEP, AND PUBLISHES EXACTLY THE ARTIFACTS THE BUILD JOBS PRODUCED.
  publish-release:
    name: Publish GitHub Release
    needs: [verify-version, build-release, build-extension, build-mihon-extension]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Compute SHA-256 Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: dist/*
          body: |
            ## 🚀 XianScan ${{ env.TAG_NAME }}

            Self-hosted AI-powered manga, manhua, and comic localization engine with embedded OCR, neural text detection, LaMa inpainting, and typesetter.

            ### 📦 Multi-Platform Downloads
 
            | Platform | Architecture | File | Acceleration Engine |
            | :--- | :--- | :--- | :--- |
            | **Windows** | x86_64 | `xianscan-windows-x86_64.zip` | ⚡ DirectX 12 DirectML (AMD, Intel, NVIDIA) |
            | **Linux** | x86_64 | `xianscan-linux-x86_64.tar.gz` | ⚡ NVIDIA CUDA 13 + cuDNN 9 (driver 580+) |
            | **macOS** | Apple Silicon (M1–M4) | `xianscan-macos-arm64.tar.gz` | ⚡ Apple Silicon CoreML + Metal |

            ### 🧩 Browser Importer Extensions
            - **Chrome / Edge / Brave / Opera**: Download `xianscan-importer-v*.zip` and extract to load unpacked in `chrome://extensions`.
            - **Firefox**: Download `xianscan-importer-firefox-v*.xpi`. It is not signed by Mozilla: load it with **Load Temporary Add-on** in `about:debugging#/runtime/this-firefox` (until Firefox restarts), or install it permanently in Firefox Developer Edition, Nightly or ESR with `xpinstall.signatures.required` set to `false`.

            ### 📱 Mihon / Tachiyomi Android Extension
            - **1-Click Extension Repository URL**: `https://raw.githubusercontent.com/ArbenApura/xianscan-rust/repo/index.min.json`
            - **Direct APK**: Download `tachiyomi-all.xianscan-*.apk` below.

            ### 🔒 Checksums
            Verify downloads with `sha256sum -c SHA256SUMS.txt --ignore-missing`.

            ---
          draft: false
          # BETA TAGS STAY FULL RELEASES UNTIL THE OWNER DECIDES ADR-009
          prerelease: false
          generate_release_notes: true

  build-docker:
    name: Build & Publish Docker Image
    needs: [publish-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.image.outputs.name }}
      image_version: ${{ steps.image.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ env.TAG_NAME }}
          persist-credentials: false

      # Reuse the exact archive build-release produced (embedded models, web
      # UI, Node.js runtime, and ORT CUDA provider libs) instead of rebuilding
      # from source, so the image always matches the release archive.
      - name: Download Linux Release Archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bin-x86_64-unknown-linux-gnu
          path: .

      - name: Check Linux Release Archive
        run: ls -lh xianscan-linux-x86_64.tar.gz

      - name: Compute Image Name and Tags
        id: image
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          VERSION="${TAG_NAME#v}"
          IMAGE="ghcr.io/${REPO_OWNER}/xianscan"
          IMAGE="${IMAGE,,}"  # GHCR repository names must be lowercase
          {
            echo "name=${IMAGE}"
            echo "version=${VERSION}"
            echo "tags=${IMAGE}:${VERSION},${IMAGE}:latest"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            XIANSCAN_VERSION=${{ steps.image.outputs.version }}

  # FEAT-008 PHASE 4: THE RELEASE-NOTES EDIT IS SPLIT OUT OF build-docker SO THE WRITE TOKEN NEVER SITS NEXT TO A BUILD.
  annotate-release-docker:
    name: Append Docker Section to Release Notes
    needs: build-docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Append Docker section to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          IMAGE: ${{ needs.build-docker.outputs.image_name }}
          VERSION: ${{ needs.build-docker.outputs.image_version }}
        run: |
          {
            echo ''
            echo '## 🐳 Docker Image'
            echo ''
            echo '```'
            echo "docker pull ${IMAGE}:${VERSION}"
            echo '```'
            echo ''
            echo "Run it: \`docker run -d -p 8124:8124 -v xianscan-config:/config ${IMAGE}:${VERSION}\`"
            echo ''
            echo "All published versions: https://github.com/${{ github.repository }}/pkgs/container/xianscan"
          } > /tmp/docker-section.md

          RELEASE=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG_NAME")
          BODY=$(echo "$RELEASE" | jq -r .body)

          # IDEMPOTENT: DON'T DUPLICATE THE SECTION ON A RE-RUN
          if [[ "$BODY" == *"🐳 Docker"* ]]; then
            echo "Docker section already present; skipping."
            exit 0
          fi

          printf '%s\n%s\n' "$BODY" "$(cat /tmp/docker-section.md)" > /tmp/new-body.md
          gh release edit "$TAG_NAME" --notes-file /tmp/new-body.md

  virustotal-scan:
    name: VirusTotal Security Scan
    needs: [publish-release, build-docker]
    runs-on: ubuntu-latest
    if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    # JOB-LEVEL SO THE STEP CONDITION BELOW DOES NOT DEPEND ON A STEP SEEING ITS OWN env (FEAT-008 PHASE 4)
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - name: Download Release Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          # ONLY THE RELEASE FILES: THE DOCKER BUILD RECORD (*.dockerbuild) FAILS TO DOWNLOAD AND IS NOT A RELEASE ASSET
          pattern: '{bin-*,importer,mihon-apk}'
          path: release-assets
          merge-multiple: true

      - name: List Release Artifacts
        run: ls -lh release-assets/

      - name: VirusTotal Analysis
        if: env.VT_API_KEY != ''
        id: virustotal
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            release-assets/xianscan-windows-*.zip
            release-assets/xianscan-linux-*.tar.gz
            release-assets/xianscan-macos-*.tar.gz
            release-assets/xianscan-importer-*.zip
            release-assets/xianscan-importer-*.xpi
            release-assets/tachiyomi-all.xianscan-*.apk

      - name: Append VirusTotal results to release notes
        if: steps.virustotal.outputs.analysis != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VT_ANALYSIS: ${{ steps.virustotal.outputs.analysis }}
        run: |
          # BUILD THE MARKDOWN TABLE FROM THE ACTION'S `<filename>=<url>,<filename>=<url>` OUTPUT
          {
            echo ''
            echo '## 🛡️ VirusTotal Scan'
            echo ''
            echo '| Artifact | Report |'
            echo '| :--- | :--- |'
            IFS=',' read -ra ENTRIES <<< "$VT_ANALYSIS"
            for e in "${ENTRIES[@]}"; do
              f="${e%%=*}"; u="${e#*=}"
              echo "| \`$f\` | [View report]($u) |"
            done
          } > /tmp/vt-section.md

          RELEASE=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG_NAME")
          BODY=$(echo "$RELEASE" | jq -r .body)

          # IDEMPOTENT: DON'T DUPLICATE THE SECTION ON A RE-RUN
          if [[ "$BODY" == *"VirusTotal Scan"* ]]; then
            echo "VirusTotal section already present; skipping."
            exit 0
          fi

          printf '%s\n%s\n' "$BODY" "$(cat /tmp/vt-section.md)" > /tmp/new-body.md
          gh release edit "$TAG_NAME" --notes-file /tmp/new-body.md
