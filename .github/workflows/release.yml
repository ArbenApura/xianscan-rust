name: Release Multi-Platform Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: xianscan.exe
            release_asset: xianscan-windows-x86_64.zip
            cargo_features: directml,embed-models,embed-web

          # Linux x86_64 (Ubuntu / Debian / Fedora)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: xianscan
            release_asset: xianscan-linux-x86_64.tar.gz
            cargo_features: embed-models,embed-web,cuda

          # macOS Apple Silicon (M1 / M2 / M3 / M4)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: xianscan
            release_asset: xianscan-macos-arm64.tar.gz
            cargo_features: embed-models,embed-web,coreml

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (for Web UI build)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux Native Build Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -y
          # Required by better-sqlite3 (node-gyp) and @napi-rs/canvas (Skia prebuilt)
          sudo apt-get install -y build-essential python3 libfontconfig1-dev

      - name: Build SvelteKit Frontend + Native Addons
        working-directory: web
        run: |
          yarn install
          yarn build

      - name: Download AI Model Weights for Embedded Binary
        shell: bash
        run: |
          mkdir -p models
          echo "Downloading RT-DETR Comic Bubble & Text Detector (~168MB)..."
          curl -f -sSL -o models/comic_text_and_bubble_detector.onnx "https://huggingface.co/ogkalu/comic-text-and-bubble-detector/resolve/main/detector.onnx"
          echo "Downloading LaMa Inpainting (~206MB)..."
          curl -f -sSL -o models/lama.onnx "https://huggingface.co/ogkalu/lama-manga-onnx-dynamic/resolve/main/lama-manga-dynamic.onnx"
          echo "Downloading PP-OCR Detection (~10MB)..."
          curl -f -sSL -o models/PP-OCRv6_det_small.onnx "https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v3.9.2/onnx/PP-OCRv6/det/PP-OCRv6_det_small.onnx"
          echo "Downloading PP-OCR Recognition (~21MB)..."
          curl -f -sSL -o models/PP-OCRv6_rec_small.onnx "https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v3.9.2/onnx/PP-OCRv6/rec/PP-OCRv6_rec_small.onnx"
          echo "Downloading Korean OCR Recognition (~13MB)..."
          curl -f -sSL -o models/korean_mobile_v2.0_rec.onnx "https://huggingface.co/xberg-io/paddleocr-onnx-models/resolve/main/rec/korean/model.onnx"
          echo "Downloading Cyrillic OCR Recognition (~8MB)..."
          curl -f -sSL -o models/cyrillic_mobile_v2.0_rec.onnx "https://huggingface.co/xberg-io/paddleocr-onnx-models/resolve/main/rec/eslav/model.onnx"
          echo "Downloading Thai OCR Recognition (~8MB)..."
          curl -f -sSL -o models/th_PP-OCRv5_mobile_rec.onnx "https://huggingface.co/xberg-io/paddleocr-onnx-models/resolve/main/rec/thai/model.onnx"
          echo "Downloading PP-OCR Direction Classifier (~0.6MB)..."
          curl -f -sSL -o models/ch_ppocr_mobile_v2.0_cls_mobile.onnx "https://huggingface.co/xberg-io/paddleocr-onnx-models/resolve/main/ch_ppocr_mobile_v2.0_cls_infer.onnx"
          ls -lh models/

      - name: Stage Standalone Node.js Runtime for Embedded Binary
        shell: bash
        run: |
          mkdir -p web/bin
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            NODE_PATH=$(which node)
            cp "$NODE_PATH" web/bin/node.exe
          else
            NODE_PATH=$(which node)
            cp "$NODE_PATH" web/bin/node
            chmod +x web/bin/node
          fi
          echo "Staged Node.js runtime version:"
          web/bin/node* --version
          ls -lh web/bin/

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Standalone 1-File Release Binary (Embedded Models + Web UI + Node.js)
        run: cargo build --release --no-default-features --features ${{ matrix.cargo_features }} --target ${{ matrix.target }}


      # Packaging Windows Archive
      - name: Package Windows Binary
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging -Force
          Copy-Item target/${{ matrix.target }}/release/xianscan.exe staging/xianscan.exe
          Copy-Item README.md staging/ -ErrorAction SilentlyContinue
          Copy-Item LICENSE staging/ -ErrorAction SilentlyContinue
          Compress-Archive -Path staging/* -DestinationPath ${{ matrix.release_asset }}

      # Packaging: resolve + ship the ORT CUDA provider libraries with the Linux binary.
      # With ort's `copy-dylibs` these land in target/ as SYMLINKS pointing into the
      # ort download cache; a bare symlink does not survive a tarball, and without the
      # provider .so files the CUDA-enabled build silently falls back to CPU at runtime.
      - name: Package Linux ORT CUDA Provider Libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p staging
          for f in libonnxruntime_providers_cuda.so \
                   libonnxruntime_providers_shared.so \
                   libonnxruntime_providers_tensorrt.so \
                   libonnxruntime_providers_nv_tensorrt_rtx.so; do
            if [ -e "target/${{ matrix.target }}/release/$f" ]; then
              cp -L "target/${{ matrix.target }}/release/$f" "staging/$f"
            fi
          done
          ls -lh staging/

      # Packaging Linux & macOS Archives
      - name: Package Unix Binary
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/xianscan staging/xianscan
          cp README.md staging/ 2>/dev/null || true
          cp LICENSE staging/ 2>/dev/null || true
          chmod +x staging/xianscan
          tar -czf ${{ matrix.release_asset }} -C staging .


      - name: Upload Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: ${{ matrix.release_asset }}
          body: |
            ## 🚀 Xianscan ${{ github.event.inputs.tag_name || github.ref_name }}

            Self-hosted AI-powered manga, manhua, and comic localization engine with embedded OCR, neural text detection, LaMa inpainting, and typesetter.

            ### 📦 Multi-Platform Downloads

            | Platform | Architecture | File |
            | :--- | :--- | :--- |
            | **Windows** | x86_64 | `xianscan-windows-x86_64.zip` |
            | **Linux** | x86_64 | `xianscan-linux-x86_64.tar.gz` |
            | **macOS** | Apple Silicon (M1–M4) | `xianscan-macos-arm64.tar.gz` |

            ### 🧩 Browser Importer Extensions
            - **Chrome / Edge / Brave / Opera**: Download `xianscan-importer-chrome.zip` and extract to load unpacked in `chrome://extensions`.
            - **Firefox**: Download `xianscan-importer-firefox.xpi` and install directly in `about:addons`.

            ---
          generate_release_notes: true

  build-extension:
    name: Build Browser Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Extension Dependencies
        working-directory: extensions/xianscan-importer
        run: yarn install

      - name: Run Extension Unit Tests
        working-directory: extensions/xianscan-importer
        run: yarn test

      - name: Package Extension (Chrome ZIP + Firefox XPI)
        working-directory: extensions/xianscan-importer
        run: yarn package

      - name: Upload Extension Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            extensions/xianscan-importer/store/*.zip
            extensions/xianscan-importer/store/*.xpi

  virustotal-scan:
    name: VirusTotal Security Scan
    needs: [build-release, build-extension]
    runs-on: ubuntu-latest
    if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download GitHub Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          mkdir -p release-assets
          gh release download "$TAG_NAME" --dir release-assets || true
          ls -lh release-assets/

      - name: VirusTotal Analysis
        if: env.VT_API_KEY != ''
        id: virustotal
        uses: crazy-max/ghaction-virustotal@v5
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            release-assets/xianscan-windows-*.zip
            release-assets/xianscan-linux-*.tar.gz
            release-assets/xianscan-macos-*.tar.gz
            release-assets/xianscan-importer-*.zip
            release-assets/xianscan-importer-*.xpi

      - name: Append VirusTotal results to release notes
        if: steps.virustotal.outputs.analysis != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          # BUILD THE MARKDOWN TABLE FROM THE ACTION'S `<filename>=<url>,<filename>=<url>` OUTPUT
          {
            echo ''
            echo '## 🛡️ VirusTotal Scan'
            echo ''
            echo '| Artifact | Report |'
            echo '| :--- | :--- |'
            IFS=',' read -ra ENTRIES <<< "${{ steps.virustotal.outputs.analysis }}"
            for e in "${ENTRIES[@]}"; do
              f="${e%%=*}"; u="${e#*=}"
              echo "| \`$f\` | [View report]($u) |"
            done
          } > /tmp/vt-section.md

          RELEASE=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG_NAME")
          BODY=$(echo "$RELEASE" | jq -r .body)

          # IDEMPOTENT — DON'T DUPLICATE THE SECTION ON A RE-RUN
          if [[ "$BODY" == *"VirusTotal Scan"* ]]; then
            echo "VirusTotal section already present; skipping."
            exit 0
          fi

          printf '%s\n%s\n' "$BODY" "$(cat /tmp/vt-section.md)" > /tmp/new-body.md
          gh release edit "$TAG_NAME" --notes-file /tmp/new-body.md



