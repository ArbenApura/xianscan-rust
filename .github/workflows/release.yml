name: Release Multi-Platform Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: xianscan.exe
            release_asset: xianscan-windows-x86_64.zip

          # Linux x86_64 (Ubuntu / Debian / Fedora)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: xianscan
            release_asset: xianscan-linux-x86_64.tar.gz

          # macOS Apple Silicon (M1 / M2 / M3 / M4)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: xianscan
            release_asset: xianscan-macos-arm64.tar.gz

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (for Web UI build)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux Native Build Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -y
          # Required by better-sqlite3 (node-gyp) and @napi-rs/canvas (Skia prebuilt)
          sudo apt-get install -y build-essential python3 libfontconfig1-dev

      - name: Build SvelteKit Frontend + Native Addons
        working-directory: web
        run: |
          npm install
          npm run build

      - name: Download AI Model Weights for Embedded Binary
        shell: bash
        run: |
          mkdir -p models
          echo "Downloading ComicTextDetector (~95MB)..."
          curl -sSL -o models/comictextdetector.pt.onnx "https://github.com/zyddnys/manga-image-translator/releases/download/beta-0.3/comictextdetector.pt.onnx"
          echo "Downloading LaMa Inpainting (~206MB)..."
          curl -sSL -o models/lama.onnx "https://huggingface.co/ogkalu/lama-manga-onnx-dynamic/resolve/main/lama-manga-dynamic.onnx"
          echo "Downloading PP-OCR Detection (~10MB)..."
          curl -sSL -o models/PP-OCRv6_det_small.onnx "https://github.com/RapidAI/RapidOCR/releases/download/v1.1.0/ch_PP-OCRv4_det_infer.onnx"
          echo "Downloading PP-OCR Recognition (~21MB)..."
          curl -sSL -o models/PP-OCRv6_rec_small.onnx "https://github.com/RapidAI/RapidOCR/releases/download/v1.1.0/ch_PP-OCRv4_rec_infer.onnx"
          ls -lh models/

      - name: Download Standalone Node.js Runtime for Embedded Binary
        shell: bash
        run: |
          mkdir -p web/bin
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            echo "Downloading Windows standalone node.exe..."
            curl -sSL -o web/bin/node.exe "https://nodejs.org/dist/v20.18.0/win-x64/node.exe"
          elif [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            echo "Downloading Linux standalone node..."
            curl -sSL "https://nodejs.org/dist/v20.18.0/node-v20.18.0-linux-x64.tar.xz" | tar -xJ -C /tmp
            cp /tmp/node-v20.18.0-linux-x64/bin/node web/bin/node
            chmod +x web/bin/node
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            echo "Downloading macOS Apple Silicon standalone node..."
            curl -sSL "https://nodejs.org/dist/v20.18.0/node-v20.18.0-darwin-arm64.tar.gz" | tar -xz -C /tmp
            cp /tmp/node-v20.18.0-darwin-arm64/bin/node web/bin/node
            chmod +x web/bin/node
          fi
          ls -lh web/bin/

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Standalone 1-File Release Binary (Embedded Models + Web UI + Node.js)
        run: cargo build --release --features embed-models,embed-web --target ${{ matrix.target }}


      # Packaging Windows Archive
      - name: Package Windows Binary
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging -Force
          Copy-Item target/${{ matrix.target }}/release/xianscan-rust.exe staging/xianscan.exe
          Copy-Item README.md staging/ -ErrorAction SilentlyContinue
          Copy-Item LICENSE staging/ -ErrorAction SilentlyContinue
          Compress-Archive -Path staging/* -DestinationPath ${{ matrix.release_asset }}

      # Packaging Linux & macOS Archives
      - name: Package Unix Binary
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/xianscan-rust staging/xianscan
          cp README.md staging/ 2>/dev/null || true
          cp LICENSE staging/ 2>/dev/null || true
          chmod +x staging/xianscan
          tar -czf ${{ matrix.release_asset }} -C staging .


      - name: Upload Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: ${{ matrix.release_asset }}
          generate_release_notes: true


